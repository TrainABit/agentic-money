name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check fatal static errors
        run: python -m ruff check --select E9,F63,F7,F82 sovereign tests
      - name: Compile
        run: python -m compileall -q sovereign tests
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Smoke-test wheel import
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/sovereign-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/sovereign-wheel" python -c "import sovereign; import sovereign.cli"
