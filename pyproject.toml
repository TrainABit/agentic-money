[project]
name = "sovereign"
version = "0.1.0"
description = "Autonomous multi-agent economic engine (Sovereign)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "cryptography>=42",
  "mnemonic>=0.21",
  "eth-account>=0.13",
  "pynacl>=1.5",
  "base58>=2.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "httpx2==2.10.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff==0.16.3",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]
mail = [
  "agentmail>=0.5.6",
]
mcp = [
  "mcp>=1.9.0",
]
web = [
  "playwright>=1.62.0",
]
keyring = [
  "keyring>=24",
]

[project.scripts]
sovereign = "sovereign.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sovereign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["slow: bounded soak or other longer runs kept in the default suite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "E", "F"]
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
packages = ["sovereign"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

[tool.coverage.run]
source = ["sovereign"]
branch = false

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_empty = true
