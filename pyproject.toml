[project]
name = "sovereign"
version = "0.1.0"
description = "Autonomous multi-agent economic engine (Sovereign)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "cryptography>=42",
  "mnemonic>=0.21",
  "eth-account>=0.13",
  "pynacl>=1.5",
  "base58>=2.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
sovereign = "sovereign.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sovereign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
