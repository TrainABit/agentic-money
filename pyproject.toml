[project]
name = "sovereign"
version = "0.1.0"
description = "Autonomous multi-agent economic engine (Sovereign)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "cryptography>=42",
  "mnemonic>=0.21",
  "eth-account>=0.13",
  "pynacl>=1.5",
  "base58>=2.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "httpx2==2.10.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.3",
]

[project.scripts]
sovereign = "sovereign.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sovereign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
